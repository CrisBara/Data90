[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "football-analytics-pro"
version = "0.1.0"
description = "Aplicación local para consultar y analizar datos históricos de fútbol de clubes."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "PySide6==6.11.2",
  "SQLAlchemy==2.0.41",
  "psycopg[binary]==3.3.6",
  "alembic==1.16.2",
  "requests==2.32.4",
  "pydantic==2.13.5",
  "pydantic-settings==2.10.1",
  "pandas==2.3.3",
  "tenacity==9.1.2",
  "platformdirs==4.3.8",
]

[project.scripts]
football-analytics = "football_analytics.main:main"

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-cov==6.2.1", "ruff==0.12.2"]
build = ["pyinstaller==6.14.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
football_analytics = ["ui/theme/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
