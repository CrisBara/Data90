[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data90"
version = "0.1.0"
description = "Aplicación local para consultar y analizar datos de fútbol de clubes."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "SQLAlchemy==2.0.41",
  "psycopg==3.3.6",
  "alembic==1.16.2",
  "requests==2.32.4",
  "pydantic==2.13.5",
  "pydantic-settings==2.10.1",
  "tenacity==9.1.2",
  "platformdirs==4.3.8",
]

[project.scripts]
data90 = "data90.main:main"
data90-web = "data90.web:main"

[project.optional-dependencies]
desktop = ["PySide6==6.11.2"]
dev = ["pytest==8.4.1", "pytest-cov==6.2.1", "ruff==0.12.2"]
build = ["PySide6==6.11.2", "pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.8"]

[dependency-groups]
workers = ["workers-py", "workers-runtime-sdk"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data90 = ["ui/theme/*.qss", "ui/web/*.html", "ui/web/*.css", "ui/web/*.js", "ui/web/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
