<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-labelledby="t d">
  <title id="t">Propuesta Data90 inspirada en el emblema de Belgrano de Córdoba</title>
  <desc id="d">Medallón circular celeste y blanco, con D90 central y el nombre Data90 debajo.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8ce8f5"/><stop offset="1" stop-color="#47b8d4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".38"/></filter>
  </defs>
  <rect width="720" height="760" rx="34" fill="#07131d"/>
  <circle cx="360" cy="310" r="232" fill="#03080c" filter="url(#shadow)"/>
  <circle cx="360" cy="310" r="210" fill="url(#sky)" stroke="#102530" stroke-width="5"/>
  <text x="360" y="343" text-anchor="middle" fill="#07131d" font-family="Segoe UI,Arial,sans-serif" font-size="145" font-weight="900" font-style="italic" letter-spacing="0"><tspan letter-spacing="0">D</tspan><tspan dx="0" letter-spacing="-3">90</tspan></text>
  <text x="360" y="622" text-anchor="middle" fill="#f3f8fa" font-family="Segoe UI,Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="-1">Data<tspan fill="#67d5e9">90</tspan></text>
  <text x="360" y="665" text-anchor="middle" fill="#8da8b6" font-family="Segoe UI,Arial,sans-serif" font-size="18" letter-spacing="3">FÚTBOL · DATOS · ANÁLISIS</text>
</svg>
